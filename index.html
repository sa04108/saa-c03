<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AWS SAA-C03 개념 위키와 문제집">
  <meta name="color-scheme" content="light">
  <title>SAA-C03 학습 자료</title>
  <link rel="stylesheet" href="assets/account.css?v=20261030-2">
  <script defer src="assets/account-config.js"></script>
  <script defer src="assets/vendor/supabase.js"></script>
  <script defer src="assets/account.js?v=20261031-1"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f7fa; color: #142d40; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 880px; margin: 0 auto; padding: 80px 24px; }
    .eyebrow { color: #a64d24; font-size: .8rem; font-weight: 800; letter-spacing: .15em; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.2; margin: 12px 0; }
    p { color: #536b7b; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 36px; }
    a { display: block; padding: 28px; border: 1px solid #cfdee8; border-radius: 16px; background: white; color: inherit; text-decoration: none; }
    a:hover { border-color: #226c92; }
    a:focus-visible { outline: 3px solid #ca6530; outline-offset: 4px; }
    h2 { margin: 0 0 12px; font-size: 1.4rem; }
    a p { margin: 0; }
    .note { margin-top: 32px; font-size: .9rem; }
  </style>
</head>
<body data-page="home">
  <main>
    <span class="eyebrow">AWS CERTIFICATION</span>
    <h1>SAA-C03 학습 자료</h1>
    <p>AWS Certified Solutions Architect · Associate</p>
    <section id="social-accounts" class="account-section" data-account-ui aria-labelledby="social-accounts-title">
      <h2 id="social-accounts-title" class="account-heading">소셜 계정</h2>
      <div class="social-account-row">
        <img class="github-icon" src="assets/github.svg" width="32" height="32" alt="GitHub">
        <span class="account-name" data-account-name hidden></span>
        <button class="account-button" type="button" data-github-login aria-label="GitHub 계정 연동" disabled>계정 연동</button>
        <button class="account-button account-button-secondary" type="button" data-account-logout aria-label="GitHub 계정 로그아웃" hidden>로그아웃</button>
      </div>
      <p class="account-message" data-account-message role="status" aria-live="polite">계정 연결을 확인하는 중…</p>
      <p class="account-message" data-account-progress hidden></p>
    </section>
    <nav aria-label="학습 자료">
      <a href="concepts/">
        <h2>개념 위키 →</h2>
        <p>핵심 개념을 찾아보고, 연결된 문제로 복습하세요.</p>
      </a>
      <a href="dumps/">
        <h2>문제집 →</h2>
        <p>684문제를 풀고 정답과 해설을 확인하세요.</p>
      </a>
    </nav>
    <p class="note">로그인하면 풀이 기록을 계정에 저장하고 다른 기기에서 이어서 풀 수 있습니다. 로그인 없이도 현재 기기와 브라우저에 저장하며 이용할 수 있습니다.</p>
  </main>
</body>
</html>
